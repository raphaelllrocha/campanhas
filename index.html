document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    return btoa(bin);

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

rm: uppercase;\n  color: var(--color-brand);\n}\n\n/* gradient text helper using the principal gradient */\n.akad-gradient-text {\n  background: var(--gradient-principal);\n  -webkit-background-clip: text;\n  background-clip: text;\n  color: transparent;\n}\n\n<\u002Fstyle>\n  <script src=\"57452c36-6934-4a6b-9052-8d2c5a9a27af\"><\u002Fscript>\n  <style>\n    body{ margin:0; background:var(--surface-subtle); font-family:var(--font-body); }\n    a{ color:var(--text-link); } a:hover{ color:var(--color-brand-hover); }\n    ::-webkit-scrollbar{ width:10px; height:10px; }\n    ::-webkit-scrollbar-thumb{ background:var(--akad-gray-300); border-radius:99px; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;display:flex;flex-direction:column;background:var(--surface-subtle)\">\n\n  <!-- HEADER -->\n  <div style=\"background:var(--surface-inverse);padding:24px 48px\" data-screen-label=\"Header\">\n    <div style=\"max-width:1240px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap\">\n      <div style=\"display:flex;align-items:center;gap:22px\">\n        <img src=\"90c240a3-fc69-4d4f-8b7a-100b25294ba7\" alt=\"Akad Seguros\" style=\"height:26px;width:auto;display:block\">\n        <div style=\"width:1px;height:38px;background:rgba(255,255,255,.22)\"><\u002Fdiv>\n        <div>\n          <div style=\"font:700 11px/1 var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--akad-magenta-bright);margin-bottom:8px\">Relatório de Performance<\u002Fdiv>\n          <h1 style=\"font:600 24px/1.2 var(--font-display);margin:0;color:#fff\">Campanhas · 2026<\u002Fh1>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:var(--radius-pill);padding:7px 18px 7px 8px\">\n        <div style=\"width:38px;height:38px;border-radius:50%;background:var(--color-brand);display:flex;align-items:center;justify-content:center;font:700 13px var(--font-display);color:#fff;flex:none\">RR<\u002Fdiv>\n        <div>\n          <div style=\"font:600 14px var(--font-display);color:#fff;line-height:1.3\">Raphael Rocha<\u002Fdiv>\n          <div style=\"font:400 12px var(--font-body);color:rgba(255,255,255,.65);line-height:1.3\">Analista de Marketing<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:1240px;margin:0 auto;padding:32px 48px 64px;width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:28px\">\n      <div style=\"display:flex;flex-direction:column;gap:24px\" data-screen-label=\"Campanhas\">\n        <div style=\"display:flex;align-items:center;gap:12px;padding-bottom:4px\">\n          <span style=\"width:5px;height:26px;border-radius:99px;background:var(--color-brand)\"><\u002Fspan>\n          <span style=\"font:700 19px var(--font-display);color:var(--text-strong)\">Rumo ao Topo — Q3<\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:22px 24px\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px\">\n            <div style=\"font:600 15px var(--font-display);color:var(--text-strong)\">Prévia do período completo da campanha<\u002Fdiv>\n            <div style=\"font:600 12px var(--font-display);color:var(--text-muted)\">Comparação com o mesmo período de 2025 · bases de 2025/2026 estimadas a partir do Δ em R$ e %<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:16px\">\n            <sc-for list=\"{{ rumoBars }}\" as=\"r\" hint-placeholder-count=\"2\">\n              <div style=\"border-bottom:1px solid var(--border-subtle);padding-bottom:16px\">\n                <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap\">\n                  <span style=\"font:700 11.5px var(--font-display);letter-spacing:.06em;text-transform:uppercase;color:{{ r.labelColor }}\">{{ r.label }}<\u002Fspan>\n                  <span style=\"font:700 14px var(--font-display);color:{{ r.deltaColor }};white-space:nowrap\">{{ r.delta }} · {{ r.deltaPct }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:44px 1fr 96px;align-items:center;gap:12px;margin-bottom:6px\">\n                  <span style=\"font:600 11px var(--font-display);color:var(--text-muted)\">2025<\u002Fspan>\n                  <div style=\"height:14px;background:var(--akad-gray-100);border-radius:99px;overflow:hidden\">\n                    <div style=\"height:100%;border-radius:99px;background:var(--akad-gray-300,#C3CBD8);width:{{ r.pct2025 }}%\"><\u002Fdiv>\n                  <\u002Fdiv>\n                  <span style=\"font:600 12.5px var(--font-display);color:var(--text-body);text-align:right;white-space:nowrap\">{{ r.v2025 }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:44px 1fr 96px;align-items:center;gap:12px\">\n                  <span style=\"font:600 11px var(--font-display);color:var(--text-strong)\">2026<\u002Fspan>\n                  <div style=\"height:14px;background:var(--akad-gray-100);border-radius:99px;overflow:hidden\">\n                    <div style=\"height:100%;border-radius:99px;background:{{ r.color }};width:{{ r.pct2026 }}%\"><\u002Fdiv>\n                  <\u002Fdiv>\n                  <span style=\"font:700 12.5px var(--font-display);color:var(--text-strong);text-align:right;white-space:nowrap\">{{ r.v2026 }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"margin-top:22px;background:rgba(31,138,91,.1);border-radius:var(--radius-md);padding:18px 22px;display:flex;align-items:center;gap:20px;flex-wrap:wrap\">\n            <span style=\"font:700 30px var(--font-display);color:var(--akad-success);white-space:nowrap\">+27 p.p.<\u002Fspan>\n            <span style=\"font:600 13.5px var(--font-body);color:var(--akad-success)\">inscritos melhores que não inscritos nesta prévia<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1fr 1.6fr;gap:16px\">\n          <div style=\"background:var(--color-secondary);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:24px;display:flex;flex-direction:column\">\n            <div style=\"font:700 10.5px var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.75);margin-bottom:10px\">Corretores sempre ativos<\u002Fdiv>\n            <div style=\"font:700 44px/1.1 var(--font-display);color:#fff;margin-bottom:14px\">+37 p.p.<\u002Fdiv>\n            <div style=\"font:600 13.5px/1.5 var(--font-body);color:rgba(255,255,255,.92);margin-bottom:22px\">melhor desempenho de quem se inscreveu na campanha<\u002Fdiv>\n            <div style=\"border-top:1px solid rgba(255,255,255,.22);padding-top:18px;margin-top:auto\">\n              <div style=\"font:700 11.5px var(--font-display);letter-spacing:.06em;text-transform:uppercase;color:#fff;margin-bottom:6px\">Recorte mais seguro<\u002Fdiv>\n              <div style=\"font:600 12px/1.5 var(--font-body);color:rgba(255,255,255,.8)\">Compara corretores que mantiveram atividade nos dois períodos.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:22px 24px\">\n            <div style=\"font:600 15px var(--font-display);color:var(--text-strong);margin-bottom:2px\">Corretores sempre ativos — variação 2025 × 2026<\u002Fdiv>\n            <div style=\"font:400 12px var(--font-body);color:var(--text-muted);margin-bottom:20px\">Entre quem manteve atividade nos dois períodos, os inscritos crescem e os não inscritos recuam<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:18px\">\n            <sc-for list=\"{{ ativosBars }}\" as=\"r\" hint-placeholder-count=\"2\">\n              <div style=\"border-bottom:1px solid var(--border-subtle);padding-bottom:16px\">\n                <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap\">\n                  <span style=\"font:700 11.5px var(--font-display);letter-spacing:.06em;text-transform:uppercase;color:{{ r.labelColor }}\">{{ r.label }}<\u002Fspan>\n                  <span style=\"font:700 14px var(--font-display);color:{{ r.deltaColor }};white-space:nowrap\">{{ r.delta }} · {{ r.deltaPct }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:44px 1fr 96px;align-items:center;gap:12px;margin-bottom:6px\">\n                  <span style=\"font:600 11px var(--font-display);color:var(--text-muted)\">2025<\u002Fspan>\n                  <div style=\"height:14px;background:var(--akad-gray-100);border-radius:99px;overflow:hidden\">\n                    <div style=\"height:100%;border-radius:99px;background:var(--akad-gray-300,#C3CBD8);width:{{ r.pct2025 }}%\"><\u002Fdiv>\n                  <\u002Fdiv>\n                  <span style=\"font:600 12.5px var(--font-display);color:var(--text-body);text-align:right;white-space:nowrap\">{{ r.v2025 }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:44px 1fr 96px;align-items:center;gap:12px\">\n                  <span style=\"font:600 11px var(--font-display);color:var(--text-strong)\">2026<\u002Fspan>\n                  <div style=\"height:14px;background:var(--akad-gray-100);border-radius:99px;overflow:hidden\">\n                    <div style=\"height:100%;border-radius:99px;background:{{ r.color }};width:{{ r.pct2026 }}%\"><\u002Fdiv>\n                  <\u002Fdiv>\n                  <span style=\"font:700 12.5px var(--font-display);color:var(--text-strong);text-align:right;white-space:nowrap\">{{ r.v2026 }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:24px\">\n          <div style=\"font:700 19px var(--font-display);color:var(--text-strong);margin-bottom:4px\">Engajamento comercial fez as inscrições saltarem na S4<\u002Fdiv>\n          <div style=\"font:400 13px var(--font-body);color:var(--text-muted);margin-bottom:22px\">A mobilização dos comerciais e o uso do grupo de corretores mudaram o ritmo da campanha.<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:230px 1fr;gap:28px;align-items:start\">\n            <div style=\"display:flex;flex-direction:column;gap:20px\">\n              <div>\n                <div style=\"font:700 32px var(--font-display);color:var(--color-brand)\">+269%<\u002Fdiv>\n                <div style=\"font:600 12.5px/1.45 var(--font-body);color:var(--text-body);margin-top:4px\">crescimento na S4 em relação à S3<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:baseline;gap:12px\">\n                <span style=\"font:700 22px var(--font-display);color:var(--color-secondary)\">96<\u002Fspan>\n                <span style=\"font:600 12px/1.4 var(--font-body);color:var(--text-body)\">inscrições na semana 4<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:baseline;gap:12px\">\n                <span style=\"font:700 22px var(--font-display);color:var(--color-secondary)\">44%<\u002Fspan>\n                <span style=\"font:600 12px/1.4 var(--font-body);color:var(--text-body)\">dos formulários do período foram concentrados na S4<\u002Fspan>\n              <\u002Fdiv>\n              <span style=\"align-self:flex-start;border-radius:var(--radius-pill);padding:8px 14px;font:700 10.5px var(--font-display);letter-spacing:.06em;text-transform:uppercase;background:rgba(218,10,91,.1);color:var(--color-brand)\">Comerciais + grupo de corretores<\u002Fspan>\n            <\u002Fdiv>\n            <div>\n              <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap\">\n                <span style=\"font:600 14px var(--font-display);color:var(--color-secondary)\">Inscrições por semana<\u002Fspan>\n                <span style=\"border-radius:var(--radius-pill);padding:8px 16px;font:700 10.5px var(--font-display);letter-spacing:.06em;text-transform:uppercase;background:var(--color-brand);color:#fff\">Pico após a mobilização<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:flex-end;gap:14px\">\n                <sc-for list=\"{{ inscricoesBars }}\" as=\"b\" hint-placeholder-count=\"5\">\n                  <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:6px\">\n                    <span style=\"font:700 12px var(--font-display);color:var(--text-strong)\">{{ b.value }}<\u002Fspan>\n                    <div style=\"height:150px;width:100%;display:flex;align-items:flex-end;justify-content:center\">\n                      <div style=\"width:100%;max-width:78px;border-radius:4px 4px 0 0;background:var(--color-brand);height:{{ b.pct }}%\"><\u002Fdiv>\n                    <\u002Fdiv>\n                    <span style=\"font:600 11px var(--font-display);color:var(--text-body)\">{{ b.label }}<\u002Fspan>\n                    <span style=\"font:400 10px var(--font-body);color:var(--text-muted);white-space:nowrap\">{{ b.per }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:24px;background:var(--akad-ice);border-radius:var(--radius-md);padding:16px 20px;font:600 13px var(--font-body);color:var(--color-secondary)\">A S4 reverteu três semanas de desaceleração e mostrou o impacto direto do apoio comercial na adesão.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:20px;overflow-x:auto\">\n          <div style=\"font:600 15px var(--font-display);color:var(--text-strong);margin-bottom:2px\">Crescimento por Cluster<\u002Fdiv>\n          <div style=\"font:400 12px var(--font-body);color:var(--text-muted);margin-bottom:16px\">Lift = diferença, em pontos percentuais, entre o crescimento dos inscritos e o dos não inscritos. Corretor Akad tem o maior lift na prévia, mas fica negativo no recorte de sempre ativos.<\u002Fdiv>\n          <div style=\"display:table;width:100%;min-width:740px\">\n            <div style=\"display:table-row;border-bottom:1.5px solid var(--border-subtle)\">\n              <div style=\"display:table-cell;padding:8px 10px;text-align:left;font:600 11px var(--font-display);color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em\">Cluster<\u002Fdiv>\n              <div style=\"display:table-cell;padding:8px 10px;text-align:right;font:600 11px var(--font-display);color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em\">Δ Inscritos (R$)<\u002Fdiv>\n              <div style=\"display:table-cell;padding:8px 10px;text-align:right;font:600 11px var(--font-display);color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em\">Δ Inscritos<\u002Fdiv>\n              <div style=\"display:table-cell;padding:8px 10px;text-align:right;font:600 11px var(--font-display);color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em\">Δ Não Inscritos<\u002Fdiv>\n              <div style=\"display:table-cell;padding:8px 10px;text-align:left;font:600 11px var(--font-display);color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em\">Lift Campanha · escala comprimida<\u002Fdiv>\n              <div style=\"display:table-cell;padding:8px 10px;text-align:right;font:600 11px var(--font-display);color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em\">Lift Sempre Ativos<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-for list=\"{{ crescRows }}\" as=\"r\" hint-placeholder-count=\"5\">\n              <div style=\"display:table-row;border-bottom:1px solid var(--border-subtle)\">\n                <div style=\"display:table-cell;padding:11px 10px;font:600 13px var(--font-body);color:var(--text-strong);white-space:nowrap\">{{ r.name }}<\u002Fdiv>\n                <div style=\"display:table-cell;padding:11px 10px;text-align:right;font:600 12.5px var(--font-body);color:var(--text-strong);white-space:nowrap\">{{ r.dR }}<\u002Fdiv>\n                <div style=\"display:table-cell;padding:11px 10px;text-align:right;font:600 12.5px var(--font-display);color:var(--color-brand);white-space:nowrap\">{{ r.dPct }}<\u002Fdiv>\n                <div style=\"display:table-cell;padding:11px 10px;text-align:right;font:400 12.5px var(--font-body);color:{{ r.nPctColor }};white-space:nowrap\">{{ r.nPct }}<\u002Fdiv>\n                <div style=\"display:table-cell;padding:11px 10px;vertical-align:middle;min-width:190px\">\n                  <div style=\"display:flex;align-items:center;gap:10px\">\n                    <div style=\"flex:1;height:8px;background:var(--akad-gray-100);border-radius:99px;overflow:hidden\">\n                      <div style=\"height:100%;border-radius:99px;background:{{ r.liftColor }};width:{{ r.liftPct }}%\"><\u002Fdiv>\n                    <\u002Fdiv>\n                    <span style=\"font:600 12px var(--font-display);color:{{ r.liftColor }};widt 002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:22px 24px\">\n          <div style=\"font:600 15px var(--font-display);color:var(--text-strong);margin-bottom:2px\">2 · Funil da Campanha<\u002Fdiv>\n          <div style=\"font:400 12px var(--font-body);color:var(--text-muted);margin-bottom:20px\">Da exposição na home até a emissão com cupom aplicado<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:14px\">\n            <sc-for list=\"{{ funilRows }}\" as=\"f\" hint-placeholder-count=\"4\">\n              <div style=\"display:grid;grid-template-columns:180px 1fr 210px;align-items:center;gap:14px\">\n                <span style=\"font:600 12.5px var(--font-body);color:var(--text-strong)\">{{ f.label }}<\u002Fspan>\n                <div style=\"height:24px;background:var(--akad-gray-100);border-radius:6px;overflow:hidden\">\n                  <div style=\"height:100%;border-radius:6px;background:{{ f.color }};width:{{ f.pct }}%\"><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:baseline;gap:10px\">\n                  <span style=\"font:700 16px var(--font-display);color:var(--text-strong)\">{{ f.value }}<\u002Fspan>\n                  <span style=\"font:400 11.5px var(--font-body);color:var(--text-muted)\">{{ f.note }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div>\n          <div style=\"font:700 11px var(--font-display);letter-spacing:.08em;text-transform:uppercase;color:var(--color-brand);margin-bottom:12px\">3 · Comportamento por grupo de corretores<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px\">\n            <sc-for list=\"{{ grupos }}\" as=\"g\" hint-placeholder-count=\"3\">\n              <div style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);overflow:hidden\">\n                <div style=\"background:{{ g.head }};padding:14px 18px\">\n                  <div style=\"font:700 14.5px var(--font-display);color:#fff\">{{ g.title }}<\u002Fdiv>\n                  <div style=\"font:400 11.5px var(--font-body);color:rgba(255,255,255,.85);margin-top:2px\">{{ g.sub }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"padding:14px 18px;display:flex;flex-direction:column;gap:9px\">\n                  <div style=\"display:flex;justify-content:space-between;gap:10px\"><span style=\"font:400 12.5px var(--font-body);color:var(--text-muted)\">Corretores<\u002Fspan><span style=\"font:700 13px var(--font-display);color:var(--text-strong)\">{{ g.corretores }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;justify-content:space-between;gap:10px\"><span style=\"font:400 12.5px var(--font-body);color:var(--text-muted)\">Cotações<\u002Fspan><span style=\"font:700 13px var(--font-display);color:var(--text-strong)\">{{ g.cotacoes }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;justify-content:space-between;gap:10px\"><span style=\"font:400 12.5px var(--font-body);color:var(--text-muted)\">Emissões<\u002Fspan><span style=\"font:700 13px var(--font-display);color:var(--text-strong)\">{{ g.emissoes }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;justify-content:space-between;gap:10px\"><span style=\"font:400 12.5px var(--font-body);color:var(--text-muted)\">Ticket médio<\u002Fspan><span style=\"font:700 13px var(--font-display);color:var(--text-strong)\">{{ g.ticket }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;justify-content:space-between;gap:10px\"><span style=\"font:400 12.5px var(--font-body);color:var(--text-muted)\">Prêmio total<\u002Fspan><span style=\"font:700 13px var(--font-display);color:var(--text-strong)\">{{ g.premio }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--border-subtle);padding-top:9px\"><span style=\"font:600 12.5px var(--font-body);color:var(--text-body)\">Conversão<\u002Fspan><span style=\"font:700 15px var(--font-display);color:var(--akad-success)\">{{ g.conv }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"font:700 10px var(--font-display);letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);margin-top:6px\">Composição por tipo de cotação<\u002Fdiv>\n                  <sc-for list=\"{{ g.comp }}\" as=\"c\" hint-placeholder-count=\"3\">\n                    <div style=\"display:flex;justify-content:space-between;gap:10px\"><span style=\"font:400 12px var(--font-body);color:var(--text-body)\">{{ c.k }}<\u002Fspan><span style=\"font:600 12px var(--font-display);color:var(--text-strong)\">{{ c.v }}<\u002Fspan><\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:22px 24px;overflow-x:auto\">\n          <div style=\"font:600 15px var(--font-display);color:var(--text-strong);margin-bottom:2px\">4 · Ticket Médio — comparação entre grupos<\u002Fdiv>\n          <div style=\"font:400 12px var(--font-body);color:var(--text-muted);margin-bottom:22px\">Prêmio médio por produto e grupo · base: emissões realizadas<\u002Fdiv>\n          <div style=\"display:flex;align-items:flex-end;gap:22px;min-width:680px\">\n            <sc-for list=\"{{ ticketBars }}\" as=\"t\" hint-placeholder-count=\"6\">\n              <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:8px\">\n                <div style=\"display:flex;flex-direction:column;align-items:center;line-height:1.3\">\n                  <span style=\"font:600 9.5px var(--font-display);color:var(--akad-success);white-space:nowrap\">{{ t.a }}<\u002Fspan>\n                  <span style=\"font:600 9.5px var(--font-display);color:#0F7EA0;white-space:nowrap\">{{ t.b }}<\u002Fspan>\n                  <span style=\"font:600 9.5px var(--font-display);color:var(--text-muted);white-space:nowrap\">{{ t.c }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"height:132px;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:5px\">\n                  <div style=\"width:24px;border-radius:4px 4px 0 0;background:var(--akad-success);height:{{ t.pctA }}%\"><\u002Fdiv>\n                  <div style=\"width:24px;border-radius:4px 4px 0 0;background:#0F7EA0;height:{{ t.pctB }}%\"><\u002Fdiv>\n                  <div style=\"width:24px;border-radius:4px 4px 0 0;background:var(--akad-gray-400,#8A96A8);height:{{ t.pctC }}%\"><\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"font:600 11px var(--font-body);color:var(--text-body);text-align:center\">{{ t.name }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:16px;margin-top:14px;font:400 11px var(--font-body);color:var(--text-muted);flex-wrap:wrap\">\n            <span style=\"white-space:nowrap\"><span style=\"display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--akad-success);margin-right:5px\"><\u002Fspan>Aplicou cupom<\u002Fspan>\n            <span style=\"white-space:nowrap\"><span style=\"display:inline-block;width:8px;height:8px;border-radius:2px;background:#0F7EA0;margin-right:5px\"><\u002Fspan>Ativou, não aplicou<\u002Fspan>\n            <span style=\"white-space:nowrap\"><span style=\"display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--akad-gray-400,#8A96A8);margin-right:5px\"><\u002Fspan>Sem cupom<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1fr 1.35fr;gap:16px\">\n          <div style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:20px\">\n            <div style=\"font:600 15px var(--font-display);color:var(--text-strong);margin-bottom:2px\">5 · Ativações por Segmento<\u002Fdiv>\n            <div style=\"font:400 12px var(--font-body);color:var(--text-muted);margin-bottom:18px\">Corretores que ativaram ao menos 1 cupom<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:12px\">\n              <sc-for list=\"{{ ativBars }}\" as=\"b\" hint-placeholder-count=\"6\">\n                <div style=\"display:grid;grid-template-columns:110px 1fr 42px;align-items:center;gap:12px\">\n                  <span style=\"font:600 12px var(--font-body);color:var(--text-body);text-align:right\">{{ b.name }}<\u002Fspan>\n                  <div style=\"height:18px;background:var(--akad-gray-100);border-radius:4px;overflow:hidden\">\n                    <div style=\"height:100%;border-radius:4px;background:{{ b.color }};width:{{ b.pct }}%\"><\u002Fdiv>\n                  <\u002Fdiv>\n                  <span style=\"font:700 12px var(--font-display);color:var(--text-strong);text-align:right\">{{ b.value }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:20px\">\n            <div style=\"font:600 15px var(--font-display);color:var(--text-strong);margin-bottom:2px\">Usabilidade — corretores por grupo e segmento<\u002Fdiv>\n            <div style=\"font:400 12px var(--font-body);color:var(--text-muted);margin-bottom:18px\">Distribuição de aplicou / ativou sem aplicar / sem cupom, com a cobertura de cada segmento. Platina, Ouro e Sem segmento não têm a divisão reportada na fonte.<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:14px\">\n              <sc-for list=\"{{ segRows }}\" as=\"s\" hint-placeholder-count=\"3\">\n                <div>\n                  <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px\">\n                    <span style=\"font:600 12.5px var(--font-body);color:var(--text-strong)\">{{ s.name }}<\u002Fspan>\n                    <span style=\"font:400 11.5px var(--font-body);color:var(--text-muted)\">{{ s.ap }} · {{ s.at }} · {{ s.sem }} — cobertura {{ s.cob }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--akad-gray-100)\">\n                    <div style=\"background:var(--akad-success);width:{{ s.pctAp }}%\"><\u002Fdiv>\n                    <div style=\"background:#0F7EA0;width:{{ s.pctAt }}%\"><\u002Fdiv>\n                    <div style=\"background:var(--akad-gray-300,#C3CBD8);width:{{ s.pctSem }}%\"><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:14px;margin-top:16px;font:400 11px var(--font-body);color:var(--text-muted);flex-wrap:wrap\">\n              <span style=\"white-space:nowrap\"><span style=\"display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--akad-success);margin-right:5px\"><\u002Fspan>Aplicou<\u002Fspan>\n              <span style=\"white-space:nowrap\"><span style=\"display:inline-block;width:8px;height:8px;border-radius:2px;background:#0F7EA0;margin-right:5px\"><\u002Fspan>Ativou, não aplicou<\u002Fspan>\n              <span style=\"white-space:nowrap\"><span style=\"display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--akad-gray-300,#C3CBD8);margin-right:5px\"><\u002Fspan>Sem cupom<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div>\n          <div style=\"font:600 15px var(--font-display);color:var(--text-strong);margin-bottom:2px\">Leituras Estratégicas — Ação de Desconto E&amp;O<\u002Fdiv>\n          <div style=\"font:400 12px var(--font-body);color:var(--text-muted);margin-bottom:14px\">O que os números acima indicam sobre o desenho do incentivo<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px\">\n            <sc-for list=\"{{ leituras }}\" as=\"l\" hint-placeholder-count=\"6\">\n              <div style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-left:4px solid var(--color-brand);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:18px 20px;display:flex;flex-direction:column;gap:8px\">\n                <div style=\"font:600 13.5px/1.4 var(--font-display);color:var(--text-strong);text-wrap:pretty\">{{ l.title }}<\u002Fdiv>\n                <div style=\"font:400 12.5px/1.6 var(--font-body);color:var(--text-body);text-wrap:pretty\">{{ l.desc }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n\n  bars(labels, values, opts) {\n    opts = opts || {};\n    const max = Math.max.apply(null, values);\n    const fmt = opts.fmt || (v => String(v));\n    return values.map((v, i) => ({\n      label: labels[i],\n      value: fmt(v),\n      pct: Math.max((v / max) * 100, 4)\n    }));\n  }\n\n  dualBars(labels, valuesA, valuesB, opts) {\n    opts = opts || {};\n    const shared = !!opts.sharedScale;\n    const maxA = shared ? Math.max.apply(null, valuesA.concat(valuesB)) : Math.max.apply(null, valuesA);\n    const maxB = shared ? : 'Cupons Ativados', sub: '7,6% dos expostos · 807 ativações totais', variant: 'neutral', accent: 'var(--color-brand)' },\n      { value: '805', label: 'Cotações c/ Cupom', sub: '291 corretores únicos · 209 ativados ainda não aplicaram', variant: 'neutral', accent: 'var(--color-secondary)' },\n      { value: '175', label: 'Emissões c/ Cupom', sub: '21,7% de conversão · parcial até 31/10', variant: 'warning', accent: 'var(--akad-success)' },\n      { value: 'R$ 413k', label: 'Prêmio Emitido c/ Cupom', sub: 'Ticket médio: R$ 2.360', variant: 'success', accent: 'var(--color-brand)' }\n    ];\n    const funilData = [\n      { label: 'Expostos na home', n: 6578, note: 'CNPJs únicos' },\n      { label: 'Cupons ativados', n: 500, note: '7,6% dos expostos' },\n      { label: 'Cotações com cupom', n: 805, note: '291 corretores únicos' },\n      { label: 'Emissões com cupom', n: 175, note: '21,7% das cotações' }\n    ];\n    const funilRows = funilData.map((d, i) => ({\n      label: d.label, value: brN(d.n), note: d.note,\n      pct: Math.max((d.n / 6578) * 100, 3),\n      color: i === 3 ? 'var(--akad-success)' : (i === 0 ? 'var(--color-secondary)' : 'var(--color-brand)')\n    }));\n\n    const grupos = [\n      { title: 'Aplicou o Cupom', sub: 'Utilizou o desconto na cotação', head: 'var(--akad-success)',\n        corretores: '291', cotacoes: '805', emissoes: '175', ticket: 'R$ 2.360', premio: 'R$ 413k', conv: '21,7%',\n        comp: [{ k: 'Seguro Novo', v: '72,3%' }, { k: 'Renovação Congênere', v: '16,1%' }, { k: 'Renovação Akad', v: '11,2%' }] },\n      { title: 'Ativou, Não Aplicou', sub: 'Ativou mas não aplicou', head: '#0F7EA0',\n        corretores: '209', cotacoes: '447', emissoes: '130', ticket: 'R$ 3.001', premio: 'R$ 390k', conv: '29,1%',\n        comp: [{ k: 'Seguro Novo', v: '53,8%' }, { k: 'Renovação Congênere', v: '8,7%' }, { k: 'Renovação Akad', v: '36,6%' }] },\n      { title: 'Sem Cupom', sub: 'Não ativou o cupom', head: 'var(--akad-gray-400,#8A96A8)',\n        corretores: '1.292', cotacoes: '2.768', emissoes: '810', ticket: 'R$ 2.641', premio: 'R$ 2.139k', conv: '29,3%',\n        comp: [{ k: 'Seguro Novo', v: '51,3%' }, { k: 'Renovação Congênere', v: '10,8%' }, { k: 'Renovação Akad', v: '37,2%' }] }\n    ];\n\n    const ticketData = [\n      { name: 'Médicos', a: 2382, b: 3365, c: 3008 },\n      { name: 'Advogados', a: 2822, b: 5261, c: 3165 },\n      { name: 'Dentistas', a: 1816, b: 1487, c: 1423 },\n      { name: 'Contabilistas', a: 4278, b: 2753, c: 4780 },\n      { name: 'Multiprofissionais', a: 2023, b: 3764, c: 1952 },\n      { name: 'Corretores de Seg.', a: 1532, b: 3777, c: 2288 }\n    ];\n    const ticketMax = Math.max.apply(null, ticketData.map(d => Math.max(d.a, d.b, d.c)));\n    const ticketBars = ticketData.map(d => ({\n      name: d.name,\n      a: 'R$ ' + brN(d.a), b: 'R$ ' + brN(d.b), c: 'R$ ' + brN(d.c),\n      pctA: (d.a / ticketMax) * 100, pctB: (d.b / ticketMax) * 100, pctC: (d.c / ticketMax) * 100\n    }));\n\n    const ativData = [\n      { name: 'Corretor Akad', n: 338, color: '#0F7EA0' },\n      { name: 'Bronze', n: 279, color: '#D9822B' },\n      { name: 'Prata', n: 122, color: 'var(--akad-gray-400,#8A96A8)' },\n      { name: 'Sem segmento', n: 35, color: 'var(--akad-gray-300,#C3CBD8)' },\n      { name: 'Ouro', n: 23, color: '#C9A227' },\n      { name: 'Platina', n: 10, color: '#8B5CF6' }\n    ];\n    const ativMax = Math.max.apply(null, ativData.map(d => d.n));\n    const ativBars = ativData.map(d => ({\n      name: d.name, value: String(d.n), color: d.color, pct: Math.max((d.n / ativMax) * 100, 2)\n    }));\n\n    const segData = [\n      { name: 'Corretor Akad', ap: 126, at: 56, sem: 568 },\n      { name: 'Bronze', ap: 97, at: 58, sem: 689 },\n      { name: 'Prata', ap: 39, at: 53, sem: 144 }\n    ];\n    const segRows = segData.map(d => {\n      const tot = d.ap + d.at + d.sem;\n      return {\n        name: d.name, ap: String(d.ap), at: String(d.at), sem: brN(d.sem), tot: brN(tot),\n        cob: dec1((d.ap / tot) * 100) + '%',\n        pctAp: (d.ap / tot) * 100, pctAt: (d.at / tot) * 100, pctSem: (d.sem / tot) * 100\n      };\n    });\n\n    const leituras = [\n      { title: 'O desconto traz volume, mas não converte melhor', desc: 'Quem aplicou o cupom converte 21,7%, abaixo de quem ativou e não aplicou (29,1%) e de quem nunca ativou (29,3%). O incentivo está atraindo cotação, não fechamento.' },\n      { title: 'O cupom reduz o ticket médio na maioria dos nichos', desc: 'Frente a quem ativou e não aplicou, o ticket com cupom é menor em 4 dos 6 produtos — Corretores de Seg. R$ 1.532 contra R$ 3.777 e Advogados R$ 2.822 contra R$ 5.261. Dentistas (R$ 1.816) e Contabilistas (R$ 4.278) são as exceções, com ticket acima dos outros grupos.' },\n      { title: '209 ativaram e não aplicaram o cupom', desc: 'São 42% de quem ativou — e o grupo converte 29,1%, acima de quem aplicou. É a oportunidade mais imediata da ação: entender por que o desconto não é usado por quem já demonstrou intenção.' },\n      { title: 'Cobertura ainda baixa na base ativa', desc: 'Bronze e Corretor Akad respondem por 617 das 807 ativações, mas a maior parte desses segmentos segue sem cupom (689 e 568 corretores). Há espaço de distribuição dentro de quem já é ativo.' },\n      { title: 'Renovação Akad é onde o cupom menos entra', desc: 'Apenas 11,2% das cotações com cupom são renovação Akad, contra 37,2% no grupo sem cupom. O desconto está concentrado em seguro novo (72,3%) — coerente com aquisição, mas não sustenta carteira.' }\n    ];\n\n    const inscData = [\n      { label: 'S1', per: '01–07/08', n: 64 }, { label: 'S2', per: '08–14/08', n: 32 },\n      { label: 'S3', per: '15–21/08', n: 26 }, { label: 'S4', per: '22–28/08', n: 96 },\n      { label: 'S5*', per: '29/08–04/09', n: 2 }\n    ];\n    const inscMax = Math.max.apply(null, inscData.map(d => d.n));\n    const inscricoesBars = inscData.map(d => ({\n      label: d.label, per: d.per, value: String(d.n), pct: Math.max((d.n / inscMax) * 100, 1.5)\n    }));\n    const adesaoData = [\n      { name: 'Corretor Akad', eleg: 17481, insc: 62 },\n      { name: 'Bronze', eleg: 1997, insc: 63 },\n      { name: 'Prata', eleg: 410, insc: 60 },\n      { name: 'Ouro', eleg: 64, insc: 22 },\n      { name: 'Platina', eleg: 9, insc: 9 }\n    ];\n    const adesaoRows = adesaoData.map(d => {\n      const r = (d.insc / d.eleg) * 100;\n      return {\n        name: d.name, eleg: brN(d.eleg), insc: String(d.insc),\n        adesao: (Math.round(r * 10) / 10).toFixed(1).replace('.', ',') + '%',\n        pct: Math.max(r, 1)\n      };\n    });\n\n\n    // ---------- METAS (escala de notas 7 a 13) ----------\n    const brNum = (v) => {\n      const s = (Math.round(v * 100) / 100).toString().replace('.', ',');\n      return s;\n    };\n    const buildMeta = (objective, kpi, current, thresholds, unit) => {\n      const fmt = (v) => brNum(v) + (unit || '');\n      // find the highest bracket the current value has reached\n      let i = -1;\n      for (let k = 0; k < thresholds.length; k++) {\n        if (current >= thresholds[k]) i = k; else break;\n      }\n      const belowScale = i === -1;\n      const nota = belowScale ? null : 7 + i;\n      const hitGoal = nota !== null && nota >= 10;\n      const badgeVariant = hitGoal ? 'success' : (belowScale ? 'danger' : 'warning');\n      const badgeLabel = hitGoal ? 'Meta do ano batida 🎉' : (belowScale ? 'Abaixo da Nota 7' : ('Nota ' + nota));\n      const scale = thresholds.map((t, k) => {\n        let barColor = 'var(--akad-gray-200)';\n        let textColor = 'var(--text-muted)';\n        if (!belowScale) {\n          if (k < i) { barColor = 'rgba(218,10,91,.35)'; textColor = 'var(--text-muted)'; }\n          else if (k === i) { barColor = 'var(--color-brand)'; textColor = 'var(--color-brand)'; }\n        }\n        return { nota: 7 + k, value: fmt(t), barColor, textColor };\n      });\n      let footer;\n      if (belowScale) {\n        footer = 'Nota atual: abaixo de 7 · faixa < ' + fmt(thresholds[0]);\n      } else if (nota === 13) {\n        footer = 'Nota atual 13 · faixa ≥ ' + fmt(thresholds[6]);\n      } else {\n        footer = 'Nota atual ' + nota + ' · faixa ' + fmt(thresholds[i]) + ' a <' + fmt(thresholds[i + 1]);\n      }\n      return {\n        objective, kpi,\n        currentLabel: fmt(current),\n        targetLabel: fmt(thresholds[3]),\n        badgeVariant, badgeLabel, scale, footer\n      };\n    };\n\n    const metas = [\n      buildMeta(\n        'Adesão de novos corretores à Universidade',\n        'Adesão à Universidade Akad',\n        5.23, [21, 24, 27, 30, 33, 36, 39], '%'\n      ),\n      buildMeta(\n        'Aumentar em 30% as cotações de corretores que passam pela Universidade',\n        'Cotações via Universidade',\n        40.1, [15, 20, 25, 30, 35, 40, 45], '%'\n      ),\n      buildMeta(\n        'Converter em vendas 12,57% dos leads gerados',\n        'Conversão dos Leads Gerados',\n        13.6, [9.31, 10.48, 11.65, 12.57, 13.74, 14.91, 16.34], '%'\n      ),\n      buildMeta(\n        'Aumentar o NPS nos fluxos de autosserviço',\n        'NPS Autosserviço',\n        57.2, [67, 69, 71, 72, 73, 75, 77], ''\n      )\n    ];\n\n    return {\n      rumoBars, ativosBars, inscricoesBars, adesaoRows, crescRows,\n      eoKpis: withTone(eoKpis), eoGwpBars, eoRows,\n      descKpis, funilRows, grupos, ticketBars, ativBars, segRows, leituras,\n      leadsKpis: withTone(leadsKpis), leadsPair, gwpPair, convPair, cplPair, semanaRows, semanaTotal, semanaBars, productRows, partnerRows, partnerConvRows, equipeRows, equipeKpis: withTone(equipeKpis), leadsNext,\n      engajamentoBars, agoBars,\n      metas\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
